<g font-family="Helvetica Neue" text-anchor="middle">
  <text x="600" y="1110" font-size="30" font-weight="500" fill="#9FB0D0" letter-spacing="4">GYM BAR HQ · AMERICAN OUTLAWS · THE BRUNCHETTES</text>
  <text x="600" y="1170" font-size="30" font-weight="500" fill="#9FB0D0" letter-spacing="4">FOUR DAYS OF FOOTBALL, FAMILY, DANCING, AND GAMES</text>
</g>

