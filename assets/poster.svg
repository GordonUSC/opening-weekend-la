<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0A1020"/>
    <stop offset="0.55" stop-color="#0D1528"/>
    <stop offset="1" stop-color="#070B16"/>
  </linearGradient>
  <radialGradient id="flood1" cx="0.18" cy="0.05" r="0.7">
    <stop offset="0" stop-color="#4D7CFF" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#4D7CFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="flood2" cx="0.85" cy="0.12" r="0.8">
    <stop offset="0" stop-color="#FFC940" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#FFC940" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="pitchglow" cx="0.5" cy="1" r="0.9">
    <stop offset="0" stop-color="#1E9E5A" stop-opacity="0.30"/>
    <stop offset="1" stop-color="#1E9E5A" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFDF7"/>
    <stop offset="0.6" stop-color="#F4E8C9"/>
    <stop offset="1" stop-color="#E9C97E"/>
  </linearGradient>
</defs>

<rect width="1200" height="1600" fill="url(#night)"/>
<rect width="1200" height="1600" fill="url(#flood1)"/>
<rect width="1200" height="1600" fill="url(#flood2)"/>
<rect width="1200" height="1600" fill="url(#pitchglow)"/>

<!-- pitch perspective -->
<g stroke="#FFFFFF" stroke-opacity="0.14" fill="none" stroke-width="3">
  <ellipse cx="600" cy="1490" rx="240" ry="62"/>
  <line x1="60" y1="1490" x2="1140" y2="1490"/>
  <line x1="180" y1="1600" x2="305" y2="1380"/>
  <line x1="1020" y1="1600" x2="895" y2="1380"/>
</g>
<circle cx="600" cy="1490" r="7" fill="#FFFFFF" fill-opacity="0.5"/>

<!-- rainbow bar -->
<g>
  <rect x="0" y="0" width="200" height="14" fill="#E40303"/>
  <rect x="200" y="0" width="200" height="14" fill="#FF8C00"/>
  <rect x="400" y="0" width="200" height="14" fill="#FFED00"/>
  <rect x="600" y="0" width="200" height="14" fill="#008026"/>
  <rect x="800" y="0" width="200" height="14" fill="#24408E"/>
  <rect x="1000" y="0" width="200" height="14" fill="#732982"/>
</g>

<text x="600" y="200" text-anchor="middle" font-family="Helvetica Neue" font-size="34" font-weight="600" letter-spacing="14" fill="#FFC940">FIFA WORLD CUP 2026 · LOS ANGELES</text>

<text x="600" y="430" text-anchor="middle" font-family="Arial Black, Helvetica" font-size="180" font-weight="900" letter-spacing="2" fill="url(#cream)">OPENING</text>
<text x="600" y="610" text-anchor="middle" font-family="Arial Black, Helvetica" font-size="180" font-weight="900" letter-spacing="2" fill="url(#cream)">WEEKEND</text>

<line x1="430" y1="680" x2="770" y2="680" stroke="#FFC940" stroke-width="3" stroke-opacity="0.7"/>

<g font-family="Helvetica Neue" text-anchor="middle">
  <text x="600" y="780" font-size="40" font-weight="700" fill="#FFFDF7">THU 11 · Mexico opens the Cup · Venice</text>
  <text x="600" y="850" font-size="40" font-weight="700" fill="#FFFDF7">FRI 12 · USA v Paraguay · Quinn at SoFi</text>
